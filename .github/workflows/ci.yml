name: ci

# GitHub Actions is an integration helper only - the primary runtime is the
# local Debian server (see docs/architecture.md).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Policy health check
        run: saturnin doctor
      - name: Exact commit disclosure self-scan
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: automation/library/disclosure_gate.sh . . "$TARGET_SHA"
      - name: Tests (with the 80% branch-coverage floor)
        run: python -m pytest --cov=saturnin --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Docs must agree with policy
        run: saturnin docs render --check
      - name: Shell syntax
        run: bash -n automation/library/*.sh scripts/*.sh
