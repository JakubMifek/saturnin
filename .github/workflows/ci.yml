name: ci

# GitHub Actions is an integration helper only - the primary runtime is the
# local Debian server (see docs/architecture.md).

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Policy health check
        run: saturnin doctor
      - name: Tests (with the 80% branch-coverage floor)
        run: python -m pytest --cov=saturnin --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Docs must agree with policy
        run: saturnin docs render --check
      - name: Shell syntax
        run: bash -n automation/library/*.sh scripts/*.sh

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Branch must be a feature branch (rules 1 and 2)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: saturnin check branch "$HEAD_REF"
