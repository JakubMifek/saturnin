name: ci

# GitHub Actions is an integration helper only - the primary runtime is the
# local Debian server (see docs/architecture.md).

on:
  push:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Policy health check
        run: saturnin doctor
      - name: Tests (with the 80% branch-coverage floor)
        run: python -m pytest --cov=saturnin --cov-branch --cov-report=term-missing --cov-fail-under=80
      - name: Docs must agree with policy
        run: saturnin docs render --check
      - name: Shell syntax
        run: bash -n automation/library/*.sh scripts/*.sh

  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted governance code
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: PR head must be a feature branch (rules 1 and 2)
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: saturnin check branch "$HEAD_REF"
      - name: Independent review gate (rule 3)
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: automation/library/review_gate.sh pr "${{ github.event.pull_request.base.repo.full_name }}#${{ github.event.pull_request.number }}" "${{ github.event.pull_request.base.repo.full_name }}"
