name: governance

# This workflow is loaded from the default branch. It only protects PRs after
# the trusted governance runtime has already been seeded there.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base governance code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out candidate as data only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Require seeded base governance runtime
        working-directory: trusted
        run: |
          if [ ! -f requirements-governance.txt ] ||
            [ ! -x automation/library/review_gate.sh ] ||
            [ ! -x automation/library/disclosure_gate.sh ]; then
            echo "::error::Base branch has no trusted Saturnin governance runtime; seed this workflow/runtime on the default branch or enforce the first scaffold approval outside this PR."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked trusted base governance runtime
        run: |
          python -m venv trusted/.venv
          trusted/.venv/bin/python -m pip install \
            --disable-pip-version-check --require-hashes \
            -r trusted/requirements-governance.txt
          trusted/.venv/bin/python -m pip install \
            --disable-pip-version-check --no-deps --no-build-isolation \
            -e trusted
      - name: Validate candidate disclosure policy as data
        run: |
          PYTHONPATH=trusted/src trusted/.venv/bin/python \
            -m saturnin.disclosure --audit-only \
            --root candidate --policy candidate/policies/disclosure.yaml
      - name: Public repository disclosure gate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trusted/automation/library/disclosure_gate.sh \
            candidate trusted "$CANDIDATE_SHA"
      - name: PR head must be a feature branch (rules 1 and 2)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        working-directory: trusted
        run: saturnin check branch "$HEAD_REF"
      - name: Independent review gate (rule 3)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SATURNIN_REVIEW_ATTESTATION_KEY: ${{ github.token }}
        working-directory: trusted
        run: automation/library/review_gate.sh pr "${{ github.event.pull_request.base.repo.full_name }}#${{ github.event.pull_request.number }}" "${{ github.event.pull_request.base.repo.full_name }}"
