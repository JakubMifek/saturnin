name: governance

# This workflow is loaded from the default branch. The first governance-bearing
# PR requires repository-native approval; once merged, PR code cannot replace
# this gate or any code it executes.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base governance code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Detect initial governance bootstrap
        id: bootstrap
        run: |
          if [ ! -f pyproject.toml ] || [ ! -x automation/library/review_gate.sh ]; then
            echo "initial=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Base branch has no Saturnin governance runtime; repository-native required reviews are the trusted bootstrap gate for this first scaffold PR."
          else
            echo "initial=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Repository-native bootstrap approval
        if: steps.bootstrap.outputs.initial == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            const {data: reviews} = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const latest = new Map();
            for (const review of reviews) {
              if (review.user.login !== author) {
                latest.set(review.user.login, review.state);
              }
            }
            if (![...latest.values()].includes("APPROVED")) {
              core.setFailed(
                "Initial governance bootstrap requires a repository-native approval from someone other than the PR author."
              );
            }
      - uses: actions/setup-python@v5
        if: steps.bootstrap.outputs.initial != 'true'
        with:
          python-version: "3.12"
      - name: Install trusted base governance
        if: steps.bootstrap.outputs.initial != 'true'
        run: python -m pip install -e ".[dev]"
      - name: PR head must be a feature branch (rules 1 and 2)
        if: steps.bootstrap.outputs.initial != 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: saturnin check branch "$HEAD_REF"
      - name: Independent review gate (rule 3)
        if: steps.bootstrap.outputs.initial != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: automation/library/review_gate.sh pr "${{ github.event.pull_request.base.repo.full_name }}#${{ github.event.pull_request.number }}" "${{ github.event.pull_request.base.repo.full_name }}"
