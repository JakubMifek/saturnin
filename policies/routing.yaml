# Role catalog + dispatch rules. The router is deliberately dumb and fast:
# first matching rule wins, otherwise the default route is used.
#
# `unit` is the permanent organizational unit a role belongs to. It is NOT a
# squad: squads are assembled ad hoc, per task, by the CEO or the chief of staff
# from whichever roles that task actually needs (see docs/delegation-policy.md).
# A rule's `squad` list is only a suggested starting crew, never a fixed team.
version: 1

roles:
  ceo:
    name: Saturnin (CEO)
    unit: command
    executes: false
    description: Routes, decides, escalates. Never writes code, never runs commands.
  chief-of-staff:
    name: Chief of Staff
    unit: command
    executes: true
    description: Keeps the board clean, chases stale work, prepares handoffs.
  code-worker:
    name: Code Worker
    unit: engineering
    executes: true
    description: Implements changes on a feature branch inside its own worktree.
  test-worker:
    name: Test Worker
    unit: engineering
    executes: true
    description: Writes and repairs tests, reproduces bugs, owns e2e suites and monitors.
  architect:
    name: Architect
    unit: engineering
    executes: true
    description: >-
      Looks across many surgical changes, spots structural drift (scattered
      APIs, duplicated features, bespoke code where an industry-standard
      library belongs) and files follow-up tasks for the code worker.
  pr-reviewer:
    name: Independent PR Reviewer
    unit: assurance
    executes: true
    zero_context: true
    description: Reviews a diff with no prior context, including private-vault integrity checks.
  issue-reviewer:
    name: Independent Issue Reviewer
    unit: assurance
    executes: true
    zero_context: true
    description: Reviews issue drafts before they are filed in managed repos.
  ops-worker:
    name: Server Ops Worker
    unit: operations
    executes: true
    description: Non-root Debian server work inside the Saturnin user scope.
  janitor:
    name: Janitor
    unit: operations
    executes: true
    description: Worktree/branch lifecycle, stale cleanup, disk hygiene.
  automation-smith:
    name: Automation Smith
    unit: platform
    executes: true
    description: Turns repeated work into reusable scripts in the automation library.
  improver:
    name: Improvement Analyst
    unit: platform
    executes: true
    description: Measures throughput, finds bottlenecks, proposes topology/policy upgrades.
  scribe:
    name: Scribe
    unit: platform
    executes: true
    description: Sole writer and curator of the private notes vault; owns durable documentation.
  researcher:
    name: Researcher
    unit: platform
    executes: true
    description: Investigates options and reports back; no repository writes.

default_route:
  role: chief-of-staff
  priority: P2
  result_contract: board-callback

# Applied when a rule does not name one. See governance.delegation.result_contracts.
default_result_contract: board-callback

# Durable knowledge is a collaboration concern, not a new permanent team.
# The router adds the scribe when these signals appear even when another role
# remains accountable for the underlying engineering, research or operations.
knowledge:
  scribe_role: scribe
  durable_information_triggers:
    labels: [documentation-needed, durable-information, knowledge-handoff]
    keywords:
      - process
      - solution
      - decision
      - research result
      - investigation result
      - durable information
  private_notes_changes:
    labels: [notes-write, vault-change, notes-curation]
    repository_policy: notes
    writer_role: scribe
    result_contract: pr-gate

rules:
  # The CEO only decides that an escalation is needed; the chief of staff files it.
  - id: escalation
    when: {any_label: [escalation, blocked, human-needed]}
    route: {role: chief-of-staff, priority: P0, escalate: true, result_contract: escalation}
  - id: review-pr
    when: {kind: pr-review}
    route: {role: pr-reviewer, priority: P1, result_contract: pr-gate}
  - id: review-issue
    when: {kind: issue-review}
    route: {role: issue-reviewer, priority: P1}
  - id: incident
    when: {any_keyword: [outage, incident, broken, failing, down, hotfix]}
    route: {role: code-worker, priority: P0, result_contract: pr-gate, squad: [code-worker, test-worker, pr-reviewer]}
  - id: architecture
    when: {any_keyword: [architecture, design review, structural, duplication, extract library, technical debt, tech debt]}
    route: {role: architect, priority: P2, squad: [architect, code-worker]}
  - id: cleanup
    when: {any_keyword: [worktree, stale branch, cleanup, prune, disk]}
    route: {role: janitor, priority: P3}
  - id: server
    when: {any_keyword: [debian, server, systemd, timer, cron, service, apt]}
    route: {role: ops-worker, priority: P2}
  - id: automation
    when: {any_keyword: [automate, script, recurring, repeated, workflow]}
    route: {role: automation-smith, priority: P2}
  - id: tests
    when: {any_keyword: [test, pytest, coverage, flaky]}
    route: {role: test-worker, priority: P2}
  - id: docs
    when: {any_keyword: [docs, documentation, readme, runbook]}
    route: {role: scribe, priority: P3}
  - id: research
    when: {any_keyword: [research, investigate, compare, evaluate]}
    route: {role: researcher, priority: P3}
  - id: improvement
    when: {any_keyword: [bottleneck, metric, throughput, improve, refactor process]}
    route: {role: improver, priority: P2}
  - id: code
    when: {any_keyword: [implement, bug, feature, refactor, fix]}
    route: {role: code-worker, priority: P2, result_contract: pr-gate, squad: [code-worker, test-worker, pr-reviewer]}
