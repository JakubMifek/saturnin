# Thresholds for the continuous self-improvement loop.
version: 1

thresholds:
  # Dispatch must stay fast; anything slower is a CEO bottleneck.
  max_median_dispatch_latency_s: 60
  # Work in progress per role before the squad is considered overloaded.
  max_wip_per_role: 5
  # Share of open tasks allowed to sit in "blocked".
  max_blocked_ratio: 0.25
  # Tasks waiting in intake (undispatched) at any time.
  max_undispatched: 3
  # Age of the oldest open task before it must be checkpointed or dropped.
  max_open_age_days: 14
  # Median cycle time target (2 days).
  max_median_cycle_time_s: 172800

actions:
  # Findings become board tasks routed by the normal router.
  create_tasks: true
  labels: [self-improvement]
  report_dir: var/reports

# Known gaps in Saturnin itself, carried as data rather than as a list in a
# document nobody owns. `saturnin improve` files each one as a board task,
# deduplicated by its `finding:<id>` marker, so an open hole has an owner and a
# state. Close a gap by deleting its entry here once the task is done.
backlog:
  - id: review-request-automation
    title: automate zero-context review requests
    severity: warn
    detail: >-
      Opening a pull request and requesting the designated zero-context reviewer
      still requires a manual step.
    recommendation: >-
      Add a policy-aware automation that requests the reviewer and records the
      resulting GitHub review event.
  - id: board-index
    title: index the board for large installations
    severity: info
    detail: >-
      Listing tasks scans every task file, which will become slow after several
      thousand tasks.
    recommendation: >-
      Maintain a locked board/index.json summary for list and filter operations.
  - id: per-role-wip-limits
    title: enforce per-role WIP limits
    severity: warn
    detail: >-
      Role overload is measured after dispatch rather than prevented while
      assigning new work.
    recommendation: >-
      Refuse dispatch above the configured role limit and leave work visibly queued.
  - id: repeat-detection
    title: improve repeated-work detection
    severity: info
    detail: >-
      Repeat detection uses only normalized title words and misses semantically
      similar work described differently.
    recommendation: >-
      Include task-body similarity when clustering repeated work.
  - id: squad-parallelism
    title: support squad-level parallelism
    severity: info
    detail: >-
      Multiple code workers cannot yet coordinate one epic through a shared
      integration branch.
    recommendation: >-
      Add a governed integration workflow for parallel workers on one epic.
  - id: cost-accounting
    title: measure cost per role, task and repository
    severity: warn
    detail: >-
      Saturnin measures latency and throughput but not what the work costs;
      token and model spend per role, per task and per repository are invisible.
    recommendation: >-
      Record model, token counts and elapsed time per dispatch in var/telemetry,
      surface cost per role in `saturnin board metrics`, and add a spend
      threshold to policies/improvement.yaml so the loop can flag an expensive
      role the same way it flags a slow one.
  - id: quality-regression-blindspot
    title: detect quality regressions, not only slow ones
    severity: warn
    detail: >-
      The improvement loop only detects bottlenecks that show up as latency or
      queue depth; a change that makes output worse without making it slower is
      invisible to it.
    recommendation: >-
      Track review outcomes per role - changes requested, follow-up findings,
      reverted merges - and treat a rising rejection rate as a finding.
  - id: policy-rollback
    title: make a bad policy change reversible
    severity: warn
    detail: >-
      A bad policy change has no recovery path beyond `git revert`; nothing
      validates a policy against recent history before it takes effect.
    recommendation: >-
      Version policy changes, keep the previous revision in var/, and add
      `saturnin policy rollback` plus a dry run that replays the last N
      dispatches through the proposed routing table.
  - id: policy-schema
    title: validate policy structure with a schema
    severity: info
    detail: >-
      `doctor` validates policy semantics but not structure, so a typo in a key
      name is only caught if some code happens to read that key.
    recommendation: >-
      Add a JSON Schema per policy file and validate all of them in `doctor`.
  - id: evaluation-harness
    title: replay dispatches to evaluate a policy change
    severity: info
    detail: >-
      There is no way to answer "did that routing change make dispatch worse?"
      other than watching the metric drift afterwards.
    recommendation: >-
      Record dispatch trajectories and replay them against a candidate policy,
      as Aider and SWE-agent do for agent behaviour.
  - id: observability-pipeline
    title: replace polled monitors with an alerting pipeline
    severity: warn
    detail: >-
      Monitoring is a curl loop on a timer; real projects should emit metrics
      and logs to a stack that alerts, rather than being polled from outside.
    recommendation: >-
      Adopt the Loki/Grafana path in docs/observability.md - projects alert,
      alerts become issues, the discovery loop turns issues into board tasks -
      and demote run_monitors.sh to the fallback for projects without a stack.
  - id: worktree-post-create-hook
    title: run project setup when a worktree is created
    severity: info
    detail: >-
      A new worktree is created empty; every worker repeats the same setup by
      hand before it can run anything.
    recommendation: >-
      Read a post-create command from the managed repo manifest and run it in
      new_work_session.sh.
  - id: project-credentials
    title: document how workers obtain project credentials
    severity: info
    detail: >-
      Saturnin holds no tokens itself, which is right, but there is no
      documented story for credentials a worker legitimately needs.
    recommendation: >-
      Decide on a secret source (host keyring or pass), document it in
      SECURITY.md, and give workers a read-only accessor rather than the store.
